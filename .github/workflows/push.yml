name: Build on push

on:
  push:
    branches: [wrynose]
  workflow_dispatch:
    inputs:
      origin_repository:
        type: string
        required: true
      origin_sha:
        type: string
        required: true
      origin_run_id:
        type: string
        required: true
      callback_repository:
        type: string
        required: false
        default: ''
      callback_sha:
        type: string
        required: false
        default: ''
      callback_check_id:
        type: string
        required: false
        default: ''

run-name: "Build on ${{ inputs.origin_repository || github.repository }}"
permissions: read-all

jobs:
  call-build:
    name: Build weekly baseline
    uses: ./.github/workflows/_build.yml
    with:
      origin_repository: ${{ inputs.origin_repository || github.repository }}
      origin_sha: ${{ inputs.origin_sha || github.sha }}
      baseline_manifest_name: weekly.xml
      baseline_manifest_revision: ''
      candidate: false
      weekly_id: ''
      callback_repository: ${{ inputs.callback_repository || '' }}
      callback_sha: ${{ inputs.callback_sha || '' }}
      callback_check_id: ${{ inputs.callback_check_id || '' }}
      origin_run_id: ${{ inputs.origin_run_id || github.run_id }}

  process-results:
    if: always()
    needs: [call-build]
    runs-on: ["ubuntu-slim"]
    steps:
      - name: Write result metadata
        env:
          CALLBACK_REPOSITORY: ${{ inputs.callback_repository || '' }}
          CALLBACK_SHA: ${{ inputs.callback_sha || '' }}
          CALLBACK_CHECK_ID: ${{ inputs.callback_check_id || '' }}
          BUILD_RESULT: ${{ needs.call-build.result }}
        run: |
          jq -n --arg callback_repository "$CALLBACK_REPOSITORY" --arg callback_sha "$CALLBACK_SHA" \
            --arg callback_check_id "$CALLBACK_CHECK_ID" --arg build_result "$BUILD_RESULT" \
            --arg workflow_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{callback_repository:$callback_repository,callback_sha:$callback_sha,callback_check_id:$callback_check_id,build_result:$build_result,workflow_url:$workflow_url}' > push_results.json
      - name: Upload result metadata
        uses: actions/upload-artifact@v7
        with:
          name: push_results.json
          path: push_results.json
          retention-days: 7
