name: Promote weekly to R2 release
run-name: Promote ${{ inputs.weekly_id }} to ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      weekly_id:
        type: string
        required: true
        description: Published weekly identifier.
      version:
        type: string
        required: true
        description: Official version (vX.Y.Z); no rebuild is performed.
      corrective_sequence:
        type: string
        required: false
        default: ''
        description: Optional corrective suffix for the same release week.

permissions: read-all

jobs:
  promote:
    uses: ./.github/workflows/promote-weekly.yml
    with:
      weekly_id: ${{ inputs.weekly_id }}
      version: ${{ inputs.version }}
      corrective_sequence: ${{ inputs.corrective_sequence }}
    secrets: inherit
